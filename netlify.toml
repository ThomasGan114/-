# Netlify 部署配置
#
# 本仓库根目录是「后端 FastAPI + 前端 Vue」的混合结构，而 Netlify 只能托管静态前端，
# 所以这里把构建范围限定在 frontend/ 子目录。
# 注意：netlify.toml 的优先级高于 Netlify 网页端 Build settings，改这里即可生效。

[build]
  # 前端子目录（后面两条路径都相对它）
  base = "frontend"
  command = "npm run build"
  # 构建产物目录 = frontend/dist
  publish = "dist"

[build.environment]
  # Vite 7 要求 Node ^20.19 或 >=22.12，固定 22 防止 Netlify 默认版本过低导致构建失败
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# 反向代理：把接口与静态资源请求转发到自建后端
#
# 后端部署在腾讯云 193.112.17.150:5412（FastAPI，systemd 服务名 campuswall）。
# 浏览器只访问 Netlify 的同源地址，因此：
#   1. 不会触发 CORS —— 无需把 *.netlify.app 加进后端的 ALLOWED_ORIGINS；
#   2. 后端也不需要 HTTPS 证书（这一跳是 Netlify 服务器之间的请求）。
#
# 以后换后端地址，只改下面两个 to 即可。
# 规则顺序很重要：具体路径在前，SPA 回退放最后。
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/api/*"
  to = "http://193.112.17.150:5412/api/:splat"
  status = 200

[[redirects]]
  from = "/static/*"
  to = "http://193.112.17.150:5412/static/:splat"
  status = 200

# SPA 回退：站内不存在的路径交给前端路由（vue-router history 模式），
# 让 /vote、/wall/message/1 这类地址直接访问或刷新时不会 404。
# 不加 force，保证 /assets/ 等真实文件仍然优先命中。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
